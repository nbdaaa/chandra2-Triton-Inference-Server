services:

  # ── Torch inference server: loads Chandra 2 via Transformers ────────────────
  # Exposes the same Triton-compatible API that the FastAPI layer calls:
  #   POST /v2/models/pipeline/infer
  #   GET  /v2/health/ready
  # No Triton or vLLM containers needed — one service, one GPU, one process.
  torch_infer:
    build:
      context: ./torch_infer
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HF_CACHE_PATH}:/root/.cache/huggingface
    environment:
      - MODEL_NAME=${MODEL_NAME:-datalab-to/chandra-ocr-2}
      - MAX_TOKENS=${MAX_TOKENS:-12384}
      - TRITON_HTTP_PORT=${TRITON_HTTP_PORT}
      - REDIS_URL=redis://localhost:${REDIS_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TRITON_HTTP_PORT}/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      # Model download + load can take several minutes on first run
      start_period: 300s
    restart: unless-stopped

  # ── FastAPI: nhận PDF/image từ client, gọi torch_infer ─────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - TRITON_URL=http://localhost:${TRITON_HTTP_PORT}
      - API_PORT=${API_PORT}
      - REDIS_URL=redis://localhost:${REDIS_PORT}
    depends_on:
      torch_infer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis: lưu job state + cancel keys ─────────────────────────────────────
  redis:
    image: redis:${REDIS_IMAGE_TAG}
    network_mode: host
    command: redis-server --port ${REDIS_PORT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

