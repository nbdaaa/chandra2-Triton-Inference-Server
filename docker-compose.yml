services:

  # ── vLLM: serve Chandra 2 model qua OpenAI-compatible API ──────────────────
  # Dùng official nightly image — đã có Qwen3_5ForConditionalGeneration support,
  # không cần build từ source, pull về là dùng ngay.
  vllm:
    image: vllm/vllm-openai:nightly
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HF_CACHE_PATH}:/root/.cache/huggingface
    command: >
      --model datalab-to/chandra-ocr-2
      --served-model-name chandra_ocr
      --host 0.0.0.0
      --port ${VLLM_PORT:-8010}
      --max-model-len 32768
      --gpu-memory-utilization 0.9
      --dtype bfloat16
      --limit-mm-per-prompt '{"image": 1}'
    # Uncommment sau khi model đã cache xong:
    # environment:
    #   - HF_HUB_OFFLINE=1
    #   - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8010}/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ── Triton: pipeline Python backend — proxy + cancel logic ─────────────────
  # Triton không chạy vLLM nữa — chỉ load pipeline backend để nhận request
  # từ FastAPI, format prompt, gọi vLLM container qua HTTP, trả kết quả về.
  # Dockerfile giờ chỉ cần update backend model.py, không cần install vLLM.
  triton:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TRITON_IMAGE_TAG: ${TRITON_IMAGE_TAG}
    network_mode: host
    ipc: host
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - ./docker-entrypoint.sh:/entrypoint.sh
      - ${MODEL_REPO_PATH}:/models
      - ${HF_CACHE_PATH}:/root/.cache/huggingface
      - type: bind
        source: ${PDF_INPUT_PATH}
        target: /data/pdfs
        bind:
          create_host_path: true
    environment:
      - TRITON_HTTP_PORT=${TRITON_HTTP_PORT}
      - TRITON_GRPC_PORT=${TRITON_GRPC_PORT}
      - TRITON_METRICS_PORT=${TRITON_METRICS_PORT}
      # Pipeline sẽ gọi vLLM container qua port này
      - VLLM_PORT=${VLLM_PORT:-8010}
      - REDIS_URL=redis://localhost:${REDIS_PORT}
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TRITON_HTTP_PORT}/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── FastAPI: nhận PDF/image từ client, gọi Triton pipeline ─────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - TRITON_URL=http://localhost:${TRITON_HTTP_PORT}
      - API_PORT=${API_PORT}
      - REDIS_URL=redis://localhost:${REDIS_PORT}
    depends_on:
      triton:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis: lưu job state + cancel keys ─────────────────────────────────────
  redis:
    image: redis:${REDIS_IMAGE_TAG}
    network_mode: host
    command: redis-server --port ${REDIS_PORT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redisinsight:
    image: redis/redisinsight:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis

  # ── Web UI ──────────────────────────────────────────────────────────────────
  web:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ── Monitoring ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG}
    networks:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--web.enable-lifecycle"
    depends_on:
      triton:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG}
    networks:
      - monitoring
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
